<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Card &amp; CTC Asset Portal</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .preview-mobile-shell {
      max-width: 412px;
      margin: 20px auto;
      border: 10px solid #0f172a;
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35);
      overflow: hidden;
      background: #f8fafc;
    }
    .preview-embed-shell {
      max-width: 1060px;
      margin: 20px auto;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 12px 30px -8px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      background: #ffffff;
    }
    .toast-enter {
      animation: toastSlide 0.25s ease-out forwards;
    }
    @keyframes toastSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Hide scrollbar cleanly for horizontal tab strip on narrow screens */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen antialiased">

  <!-- Prototype Control Ribbon (Role Switcher + Device/Embed Preview) -->
  <div class="bg-slate-950 text-slate-200 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-sky-400">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Interactive Prototype
        </span>
        <span class="hidden md:inline text-slate-600">|</span>
        <div class="inline-flex bg-slate-900 p-0.5 rounded-lg border border-slate-800" role="tablist" aria-label="Role Switcher">
          <button type="button" data-action="switch-role" data-role="public" id="role-btn-public"
            class="px-2.5 sm:px-3 py-1 rounded-md text-xs font-semibold transition">
            Public / Dept
          </button>
          <button type="button" data-action="switch-role" data-role="instructor" id="role-btn-instructor"
            class="px-2.5 sm:px-3 py-1 rounded-md text-xs font-semibold transition">
            Instructor
          </button>
          <button type="button" data-action="switch-role" data-role="admin" id="role-btn-admin"
            class="px-2.5 sm:px-3 py-1 rounded-md text-xs font-semibold transition flex items-center gap-1.5">
            Admin
            <span id="admin-badge" class="hidden px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-amber-500 text-slate-950"></span>
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <div class="hidden sm:inline-flex bg-slate-900 p-0.5 rounded-lg border border-slate-800" aria-label="Viewport Preview">
          <button type="button" data-action="switch-preview" data-preview="full" id="preview-btn-full"
            class="px-2.5 py-1 rounded-md text-xs font-medium transition">
            Full View
          </button>
          <button type="button" data-action="switch-preview" data-preview="mobile" id="preview-btn-mobile"
            class="px-2.5 py-1 rounded-md text-xs font-medium transition">
            Mobile (iOS/Android)
          </button>
          <button type="button" data-action="switch-preview" data-preview="embed" id="preview-btn-embed"
            class="px-2.5 py-1 rounded-md text-xs font-medium transition">
            Website Embed
          </button>
        </div>
        <button type="button" data-action="open-embed-modal"
          class="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          &lt;/&gt; Embed Code
        </button>
        <button type="button" data-action="reset-demo"
          class="px-2.5 py-1 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
          title="Reset all demo data">
          Reset
        </button>
      </div>
    </div>
  </div>

  <!-- Optional Website Embed Mock Wrapper -->
  <div id="embed-host-banner" class="hidden max-w-6xl mx-auto px-4 pt-5">
    <div class="bg-white border border-slate-200 rounded-t-2xl px-6 py-4 flex flex-wrap items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-red-700 text-white font-extrabold text-sm flex items-center justify-center">MN</div>
        <div>
          <div class="text-sm font-bold text-slate-900">West Metro Fire Training Consortium</div>
          <div class="text-xs text-slate-500">https://westmetrofiretraining.org/blue-card-portal &mdash; Embedded Portal Preview</div>
        </div>
      </div>
      <div class="flex items-center gap-4 text-xs font-medium text-slate-500">

        <span class="text-blue-700 font-semibold border-b-2 border-blue-700 pb-0.5">Blue Card &amp; CTC Portal</span>
        <span>Resources</span>

    </div>
  </div>

    <header class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white">

        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-900/40 shrink-0">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
              </svg>
            </div>
            <div>
              <h1 class="text-base sm:text-lg font-bold tracking-tight leading-tight">Blue Card &amp; CTC Asset Portal</h1>
              <p id="header-subtitle" class="text-xs text-blue-200/90 mt-0.5">Public Self-Service &bull; Command Training Centers &amp; Initial Cert Labs</p>
            </div>
          </div>
          <div id="header-role-pill" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-white/10 border border-white/15 text-blue-100">
          </div>
        </div>

        <!-- Sub-navigation Tabs -->
        <nav id="sub-nav" class="mt-4 flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5" aria-label="Portal sections">
        </nav>
      </div>
    </header>

    <!-- Main Dynamic Content -->
    <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 py-5 sm:py-6 pb-16">
    </main>
  </div>

  <!-- Modal Backdrop & Container -->
  <div id="modal-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4 overflow-y-auto">
    <div id="modal-panel" class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg my-auto overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between gap-3 bg-slate-50">
        <h2 id="modal-title" class="text-base font-bold text-slate-900"></h2>
        <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/70 transition" aria-label="Close modal">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="modal-body" class="p-5 max-h-[75vh] overflow-y-auto"></div>
    </div>
  </div>

  <!-- Toast Stack -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-[calc(100%-2rem)] pointer-events-none"></div>

  <script>

      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.assets) && Array.isArray(parsed.labs)) {
              return parsed;
            }
          }
        } catch (e) {
          // Safe fallback in restricted iframe storage
        }
        return getInitialState();
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // Ignore storage quota / sandbox restrictions
        }
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function requiredInstructors(studentCount) {
        const count = Math.max(1, Math.min(12, parseInt(studentCount, 10) || 1));
        return Math.ceil(count / 4);
      }

      function formatDateShort(iso) {
        if (!iso) return '—';
        const parts = iso.split('-');
        if (parts.length !== 3) return iso;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        return (months[m] || parts[1]) + ' ' + d + ', ' + parts[0];
      }

      function formatRange(start, end) {
        if (!start) return '—';
        if (!end || start === end) return formatDateShort(start);
        const s = start.split('-');
        const e = end.split('-');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        if (s[0] === e[0] && s[1] === e[1]) {
          return months[parseInt(s[1], 10) - 1] + ' ' + parseInt(s[2], 10) + '–' + parseInt(e[2], 10) + ', ' + s[0];
        }
        return formatDateShort(start) + ' – ' + formatDateShort(end);
      }

      function datesOverlap(startA, endA, startB, endB) {
        return startA <= endB && startB <= endA;
      }

      function getAssetById(id) {
        return state.assets.find(a => a.id === id) || null;
      }

      function getAssetConflicts(assetId, startDate, endDate) {
        const conflicts = [];
        const asset = getAssetById(assetId);
        if (asset && asset.status === 'Checked Out' && asset.currentCheckout) {
          if (datesOverlap(startDate, endDate, asset.currentCheckout.checkedOutDate, asset.currentCheckout.dueDate)) {
            conflicts.push({
              label: 'Checked out by ' + asset.currentCheckout.department,
              dates: formatRange(asset.currentCheckout.checkedOutDate, asset.currentCheckout.dueDate)
            });
          }
        }
        state.reservations
          .filter(r => r.assetId === assetId && r.status === 'Confirmed')
          .forEach(r => {
            if (datesOverlap(startDate, endDate, r.startDate, r.endDate)) {
              conflicts.push({
                label: 'Reserved for ' + r.department,
                dates: formatRange(r.startDate, r.endDate)
              });
            }
          });
        return conflicts;
      }

      function findAvailableAssetForDates(startDate, endDate, preferredId) {
        if (preferredId) {
          const pref = getAssetById(preferredId);
          if (pref && pref.status !== 'Needs Inspection' && getAssetConflicts(pref.id, startDate, endDate).length === 0) {
            return pref;
          }
        }
        for (const asset of state.assets) {
          if (asset.status !== 'Needs Inspection' && getAssetConflicts(asset.id, startDate, endDate).length === 0) {
            return asset;
          }
        }
        return null;
      }

      function logActivity(type, message) {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        state.activityLog.unshift({
          id: 'ACT-' + Date.now(),
          timestamp: TODAY + ' ' + hh + ':' + mm,
          type,
          message
        });
      }

      function showToast(message, tone) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const colors = {
          success: 'bg-emerald-900 text-emerald-50 border-emerald-700',
          info: 'bg-slate-900 text-white border-slate-700',
          warning: 'bg-amber-900 text-amber-50 border-amber-700',
          error: 'bg-rose-900 text-rose-50 border-rose-700'
        };
        const el = document.createElement('div');
        el.className = 'toast-enter pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-sm font-medium flex items-start justify-between gap-3 ' + (colors[tone] || colors.info);
        el.innerHTML = '<span>' + escapeHtml(message) + '</span>';
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 3800);
      }

      function openModal(title, bodyHtml) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-body').innerHTML = bodyHtml;
        const overlay = document.getElementById('modal-overlay');
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      }

      function closeModal() {
        const overlay = document.getElementById('modal-overlay');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }

      function statusBadge(status) {
        const map = {
          'Available': 'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-600/20',
          'Checked Out': 'bg-blue-50 text-blue-700 ring-1 ring-blue-600/20',
          'Needs Inspection': 'bg-rose-50 text-rose-700 ring-1 ring-rose-600/20',
          'Confirmed': 'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-600/20',
          'Pending Confirmation': 'bg-amber-50 text-amber-800 ring-1 ring-amber-600/25',
          'Declined': 'bg-slate-100 text-slate-600 ring-1 ring-slate-300'
        };
        const dot = {
          'Available': 'bg-emerald-500',
          'Checked Out': 'bg-blue-500',
          'Needs Inspection': 'bg-rose-500',
          'Confirmed': 'bg-emerald-500',
          'Pending Confirmation': 'bg-amber-500',
          'Declined': 'bg-slate-400'
        };
        return '<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold ' + (map[status] || 'bg-slate-100 text-slate-700') + '">' +
          '<span class="w-1.5 h-1.5 rounded-full ' + (dot[status] || 'bg-slate-400') + '"></span>' +
          escapeHtml(status) + '</span>';
      }

      // ---------- RENDER SHELL ----------
      function render() {
        saveState();
        updateTopBar();
        updateHeader();
        renderMain();
      }

      function updateTopBar() {
        ['public', 'instructor', 'admin'].forEach(r => {
          const btn = document.getElementById('role-btn-' + r);
          if (!btn) return;
          if (state.role === r) {
            btn.className = 'px-2.5 sm:px-3 py-1 rounded-md text-xs font-semibold bg-blue-600 text-white shadow-sm transition flex items-center gap-1.5';
          } else {
            btn.className = 'px-2.5 sm:px-3 py-1 rounded-md text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1.5';
          }
        });

        const pendingCount = state.labs.filter(l => l.status === 'Pending Confirmation').length;
        const badge = document.getElementById('admin-badge');
        if (badge) {
          if (pendingCount > 0) {
            badge.textContent = String(pendingCount);
            badge.classList.remove('hidden');
          } else {
            badge.classList.add('hidden');
          }
        }

        ['full', 'mobile', 'embed'].forEach(p => {
          const btn = document.getElementById('preview-btn-' + p);
          if (!btn) return;
          btn.className = state.preview === p
            ? 'px-2.5 py-1 rounded-md text-xs font-medium bg-slate-700 text-white transition'
            : 'px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition';
        });

        const frame = document.getElementById('app-frame');
        const hostBanner = document.getElementById('embed-host-banner');
        frame.className = 'transition-all duration-200';
        hostBanner.classList.add('hidden');

        if (state.preview === 'mobile') {
          frame.className = 'preview-mobile-shell';
        } else if (state.preview === 'embed') {
          hostBanner.classList.remove('hidden');
          frame.className = 'preview-embed-shell rounded-t-none border-t-0 mt-0';
        }
      }

      function updateHeader() {
        const sub = document.getElementById('header-subtitle');
        const pill = document.getElementById('header-role-pill');
        const nav = document.getElementById('sub-nav');

        const configs = {
          public: {
            subtitle: 'Public Self-Service • Track, Reserve, Check Out & Return CTC Kits • Request Blue Card Labs',
            pill: 'Public / Department Portal',
            tabs: [
              { id: 'assets', label: 'CTC Assets (' + state.assets.length + ')' },
              { id: 'request-lab', label: 'Request Blue Card Lab' },
              { id: 'schedule', label: 'Schedule & Reservations' }
            ]
          },
          instructor: {
            subtitle: 'Blue Card Instructor Portal • Sign Up to Teach Confirmed Labs (4:1 Ratio, Max 12 Students)',
            pill: 'Instructor: ' + state.activeInstructor.name,
            tabs: [
              { id: 'open-labs', label: 'Open Lab Signups' },
              { id: 'my-classes', label: 'My Teaching Schedule' }
            ]
          },
          admin: {
            subtitle: 'Coordinator Admin • Confirm Labs (Auto-Reserves CTC), Manage Fleet & Activity Log',
            pill: 'Admin Coordinator',
            tabs: [
              { id: 'pending-labs', label: 'Lab Requests & Staffing' },
              { id: 'fleet', label: 'Fleet & Activity Log' }
            ]
          }
        };

        const cfg = configs[state.role];
        sub.textContent = cfg.subtitle;
        pill.textContent = cfg.pill;

        const currentTab = state.activeTab[state.role];
        nav.innerHTML = cfg.tabs.map(t => {
          const active = t.id === currentTab;
          return '<button type="button" data-action="switch-tab" data-tab="' + t.id + '" class="whitespace-nowrap px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition ' +
            (active ? 'bg-white text-slate-900 shadow-sm' : 'text-blue-100/80 hover:text-white hover:bg-white/10') + '">' +
            escapeHtml(t.label) + '</button>';
        }).join('');
      }

      function renderMain() {
        const main = document.getElementById('main-content');
        const tab = state.activeTab[state.role];

        if (state.role === 'public') {
          if (tab === 'assets') main.innerHTML = renderPublicAssets();
          else if (tab === 'request-lab') main.innerHTML = renderLabRequestForm();
          else main.innerHTML = renderPublicSchedule();
        } else if (state.role === 'instructor') {
          main.innerHTML = renderInstructorPortal(tab);
        } else {
          if (tab === 'pending-labs') main.innerHTML = renderAdminLabs();
          else main.innerHTML = renderAdminFleet();
        }
      }

          .filter(l => l.status === 'Confirmed')
          .sort((a, b) => a.startDate.localeCompare(b.startDate));

        return `

            <div>

              <p class="text-sm text-slate-600">Staffed at a <strong>4:1 student-to-instructor ratio</strong> (1–4 students: 1 instructor, 5–8: 2 instructors, 9–12: 3 instructors).</p>
            </div>

            ${visibleLabs.length === 0 ? `
              <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center">

              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Home Station / Location *</label>
                <input name="homeLocation" type="text" required placeholder="e.g., Minnetonka Fire"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Street Address *</label>
              <input name="address" type="text" required placeholder="e.g., 14550 Minnetonka Blvd, Minnetonka, MN"
                class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Pickup / Storage Notes</label>
              <input name="notes" type="text" placeholder="e.g., Training Room Cabinet 2"
                class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm" />
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700">Cancel</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold">Add Asset</button>
            </div>
          </form>
        `);
      }

      function openEmbedModal() {
        const snippet = '<iframe\n  src="https://portal.yourtraininggroup.org/blue-card"\n  title="Blue Card & CTC Asset Portal"\n  style="width:100%; min-height:780px; border:0; border-radius:12px;"\n  loading="lazy">\n</iframe>';
        openModal('Website Embed & Mobile Access', `
          <div class="space-y-4 text-xs text-slate-700">
            <p>When deployed, this single web app works in <strong>iOS Safari</strong>, <strong>Android Chrome</strong> (addable to home screen as a PWA), and embeds directly into any existing website with one snippet:</p>
            <pre id="embed-snippet" class="p-3.5 rounded-xl bg-slate-900 text-sky-300 overflow-x-auto font-mono text-[11px] leading-relaxed">${escapeHtml(snippet)}</pre>
            <div class="flex justify-between items-center gap-2 pt-1">
              <button type="button" data-action="copy-embed" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold transition">Copy Embed Snippet</button>
              <button type="button" data-action="close-modal" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-semibold">Close</button>
            </div>
          </div>
        `);
      }

      // ---------- EVENT DELEGATION ----------
      document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-action]');
        if (!btn) {
          if (e.target.id === 'modal-overlay') closeModal();
          return;
        }
        const action = btn.getAttribute('data-action');

        if (action === 'switch-role') {
          state.role = btn.getAttribute('data-role');
          render();
        } else if (action === 'switch-preview') {
          state.preview = btn.getAttribute('data-preview');
          render();
        } else if (action === 'switch-tab') {
          state.activeTab[state.role] = btn.getAttribute('data-tab');
          render();
        } else if (action === 'close-modal') {
          closeModal();
        } else if (action === 'open-reserve-modal') {
          openReserveModal(btn.getAttribute('data-asset-id'));
        } else if (action === 'open-checkout-modal') {
          openCheckoutModal(btn.getAttribute('data-asset-id'));
        } else if (action === 'open-return-modal') {
          openReturnModal(btn.getAttribute('data-asset-id'));
        } else if (action === 'open-asset-details') {
          openAssetDetailsModal(btn.getAttribute('data-asset-id'));
        } else if (action === 'open-add-asset-modal') {
          openAddAssetModal();
        } else if (action === 'open-embed-modal') {
          openEmbedModal();
        } else if (action === 'copy-embed') {
          const pre = document.getElementById('embed-snippet');
          const text = pre ? pre.textContent : '';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => showToast('Embed code copied to clipboard!', 'success')).catch(() => fallbackCopy(text));
          } else {
            fallbackCopy(text);
          }
        } else if (action === 'reset-demo') {
          state = getInitialState();
          render();
          showToast('Demo data reset to initial state.', 'info');
        } else if (action === 'confirm-lab') {
          handleConfirmLab(btn.getAttribute('data-lab-id'));
        } else if (action === 'decline-lab') {
          handleDeclineLab(btn.getAttribute('data-lab-id'));
        } else if (action === 'toggle-instructor-signup') {
          handleToggleInstructor(btn.getAttribute('data-lab-id'));
        } else if (action === 'mark-available') {
          const asset = getAssetById(btn.getAttribute('data-asset-id'));
          if (asset) {
            asset.status = 'Available';
            asset.condition = 'Good';
            asset.notes = 'Cleared by Admin inspection. Ready for instant self-service.';
            logActivity('return', asset.id + ' (' + asset.homeLocation + ') cleared from inspection hold and returned to Available.');
            render();
            showToast(asset.id + ' is now Available.', 'success');
          }
        }
      });

      document.addEventListener('change', function (e) {
        if (e.target.id === 'instructor-switcher') {
          const chosen = SAMPLE_INSTRUCTORS.find(i => i.name === e.target.value);
          if (chosen) {
            state.activeInstructor = Object.assign({}, chosen);
            render();
            showToast('Switched instructor view to ' + chosen.name, 'info');
          }
        }
      });

      document.addEventListener('input', function (e) {
        if (e.target.id === 'lab-students') {
          const val = parseInt(e.target.value, 10) || 1;
          const req = requiredInstructors(val);
          const pill = document.getElementById('ratio-pill');
          if (pill) {
            pill.textContent = val + ' Student' + (val > 1 ? 's' : '') + ' \u2192 ' + req + ' Instructor' + (req > 1 ? 's' : '') + ' Needed (4:1)';
          }
        }
      });

      document.addEventListener('submit', function (e) {
        const form = e.target;
        if (form.id === 'lab-request-form') {
          e.preventDefault();
          const fd = new FormData(form);
          const startDate = fd.get('startDate');
          const endDate = fd.get('endDate');
          if (endDate < startDate) {
            showToast('End date must be on or after the start date.', 'error');
            return;
          }
          const studentCount = Math.max(1, Math.min(12, parseInt(fd.get('studentCount'), 10) || 1));
          const newId = 'LAB-' + (201 + state.labs.length);
          state.labs.unshift({
            id: newId,
            department: fd.get('department').trim(),
            hostFacility: fd.get('hostFacility').trim(),
            contactName: fd.get('contactName').trim(),
            contactEmail: fd.get('contactEmail').trim(),
            contactPhone: fd.get('contactPhone').trim(),
            startDate,
            endDate,
            studentCount,
            preferredAssetId: fd.get('preferredAssetId') || '',
            reservedAssetId: null,
            status: 'Pending Confirmation',
            instructors: [],
            notes: (fd.get('notes') || '').trim()
          });
          logActivity('lab', newId + ' requested by ' + fd.get('department').trim() + ' (' + studentCount + ' students, ' + formatRange(startDate, endDate) + ').');
          state.activeTab.public = 'schedule';
          render();
          showToast('Lab request ' + newId + ' submitted! Switch to Admin to confirm & auto-reserve a CTC.', 'success');
        } else if (form.id === 'reserve-form') {
          e.preventDefault();
          const assetId = form.getAttribute('data-asset-id');
          const fd = new FormData(form);
          const startDate = fd.get('startDate');
          const endDate = fd.get('endDate');
          const errEl = document.getElementById('reserve-error');
          if (endDate < startDate) {
            errEl.textContent = 'End date must be on or after the start date.';
            errEl.classList.remove('hidden');
            return;
          }
          const conflicts = getAssetConflicts(assetId, startDate, endDate);
          if (conflicts.length > 0) {
            const alt = findAvailableAssetForDates(startDate, endDate, null);
            errEl.innerHTML = '<strong>Date conflict on ' + escapeHtml(assetId) + ':</strong> ' +
              escapeHtml(conflicts[0].label + ' (' + conflicts[0].dates + ')') + '.' +
              (alt ? ' Try <strong>' + escapeHtml(alt.id + ' — ' + alt.homeLocation) + '</strong>, which is open for those dates.' : '');
            errEl.classList.remove('hidden');
            return;
          }
          const asset = getAssetById(assetId);
          state.reservations.push({
            id: 'RES-' + (1001 + state.reservations.length),
            assetId,
            department: fd.get('department').trim(),
            contactName: fd.get('contactName').trim(),
            contactPhone: fd.get('contactPhone').trim(),
            startDate,
            endDate,
            purpose: fd.get('purpose').trim(),
            linkedLabId: null,
            status: 'Confirmed'
          });
          logActivity('reserve', assetId + ' (' + (asset ? asset.homeLocation : '') + ') instantly reserved by ' + fd.get('department').trim() + ' for ' + formatRange(startDate, endDate) + '.');
          closeModal();
          render();
          showToast(assetId + ' instantly reserved for ' + formatRange(startDate, endDate) + '!', 'success');
        } else if (form.id === 'checkout-form') {
          e.preventDefault();
          const assetId = form.getAttribute('data-asset-id');
          const asset = getAssetById(assetId);
          if (!asset) return;
          const fd = new FormData(form);
          asset.status = 'Checked Out';
          asset.currentCheckout = {
            department: fd.get('department').trim(),
            contactName: fd.get('contactName').trim(),
            contactPhone: fd.get('contactPhone').trim(),
            checkedOutDate: TODAY,
            dueDate: fd.get('dueDate'),
            purpose: fd.get('purpose').trim()
          };
          logActivity('checkout', asset.id + ' (' + asset.homeLocation + ') checked out by ' + asset.currentCheckout.contactName + ' (' + asset.currentCheckout.department + ') — due ' + asset.currentCheckout.dueDate + '.');
          closeModal();
          render();
          showToast(asset.id + ' checked out! Due back ' + formatDateShort(asset.currentCheckout.dueDate) + '.', 'success');
        } else if (form.id === 'return-form') {
          e.preventDefault();
          const assetId = form.getAttribute('data-asset-id');
          const asset = getAssetById(assetId);
          if (!asset) return;
          const fd = new FormData(form);
          const condition = fd.get('condition');
          const returnedBy = fd.get('returnedBy').trim();
          const notes = (fd.get('notes') || '').trim();
          asset.currentCheckout = null;
          asset.condition = condition;
          if (condition === 'Needs Inspection') {
            asset.status = 'Needs Inspection';
            asset.notes = notes || 'Flagged on return by ' + returnedBy + ' for missing item/damage.';
          } else {
            asset.status = 'Available';
            asset.notes = notes ? 'Returned by ' + returnedBy + ': ' + notes : 'Returned in ' + condition.toLowerCase() + ' condition by ' + returnedBy + '.';
          }
          logActivity('return', asset.id + ' (' + asset.homeLocation + ') returned by ' + returnedBy + ' (' + condition + ').');
          closeModal();
          render();
          showToast(condition === 'Needs Inspection' ? asset.id + ' returned & flagged for Admin inspection.' : asset.id + ' returned and is now Available!', condition === 'Needs Inspection' ? 'warning' : 'success');
        } else if (form.id === 'add-asset-form') {
          e.preventDefault();
          const fd = new FormData(form);
          const id = fd.get('id').trim().toUpperCase();
          if (getAssetById(id)) {
            showToast('An asset with ID ' + id + ' already exists.', 'error');
            return;
          }
          state.assets.push({
            id,
            name: id + ' (Command Training Center in a Box)',
            homeLocation: fd.get('homeLocation').trim(),
            address: fd.get('address').trim(),
            status: 'Available',
            condition: 'Good',
            currentCheckout: null,
            kitItems: DEFAULT_KIT_ITEMS.slice(),
            notes: (fd.get('notes') || 'Ready for instant self-service checkout.').trim()
          });
          logActivity('reserve', 'Added new asset ' + id + ' (' + fd.get('homeLocation').trim() + ') to fleet.');
          closeModal();
          render();
          showToast('Added ' + id + ' to the fleet!', 'success');
        }
      });

      function handleConfirmLab(labId) {
        const lab = state.labs.find(l => l.id === labId);
        if (!lab) return;
        const candidate = findAvailableAssetForDates(lab.startDate, lab.endDate, lab.preferredAssetId);
        if (!candidate) {
          showToast('No CTC is available for ' + formatRange(lab.startDate, lab.endDate) + '. Adjust dates or free a booking first.', 'error');
          return;
        }
        lab.status = 'Confirmed';
        lab.reservedAssetId = candidate.id;
        state.reservations.push({
          id: 'RES-' + (1001 + state.reservations.length),
          assetId: candidate.id,
          department: lab.department,
          contactName: lab.contactName,
          contactPhone: lab.contactPhone,
          startDate: lab.startDate,
          endDate: lab.endDate,
          purpose: 'Blue Card Initial Certification Lab (' + lab.studentCount + ' students)',
          linkedLabId: lab.id,
          status: 'Confirmed'
        });
        logActivity('lab', lab.id + ' (' + lab.department + ') confirmed — ' + candidate.id + ' (' + candidate.homeLocation + ') auto-reserved for ' + formatRange(lab.startDate, lab.endDate) + '.');
        render();
        showToast('Lab confirmed! ' + candidate.id + ' (' + candidate.homeLocation + ') auto-reserved & instructor slots opened.', 'success');
      }

      function handleDeclineLab(labId) {
        const lab = state.labs.find(l => l.id === labId);
        if (!lab) return;
        lab.status = 'Declined';
        logActivity('lab', lab.id + ' (' + lab.department + ') declined by Admin.');
        render();
        showToast(lab.id + ' marked as declined.', 'info');
      }

      function handleToggleInstructor(labId) {
        const lab = state.labs.find(l => l.id === labId);
        if (!lab) return;
        const me = state.activeInstructor;
        const idx = lab.instructors.findIndex(i => i.name === me.name);
        if (idx >= 0) {
          lab.instructors.splice(idx, 1);
          logActivity('lab', me.name + ' withdrew from teaching ' + lab.id + ' (' + lab.department + ').');
          render();
          showToast('Withdrawn from ' + lab.department + ' lab.', 'info');
        } else {
          const needed = requiredInstructors(lab.studentCount);
          if (lab.instructors.length >= needed) {
            showToast('Instructor roster is already full for this lab.', 'warning');
            return;
          }
          lab.instructors.push(Object.assign({}, me));
          logActivity('lab', me.name + ' signed up to teach ' + lab.id + ' (' + lab.department + ', ' + formatRange(lab.startDate, lab.endDate) + ').');
          render();
          showToast('Signed up to teach ' + lab.department + ' (' + formatRange(lab.startDate, lab.endDate) + ')!', 'success');
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Embed code copied to clipboard!', 'success');
        } catch (err) {
          showToast('Select the snippet above to copy.', 'info');
        }
        ta.remove();
      }

      render();
    })();
  </script>
</body>
</html>
